name: Flutter Nightly Build

on:
  # Daily schedule removed: GitHub disables Actions on forks that run inherited
  # scheduled builds, and a nightly full cross-platform build is useless here.
  # Still startable by hand from the Actions page when needed.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
